<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f0" />
    <meta name="description" content="SpendSense — your personal budget and spending insight workspace." />
    <script>
      try {
        const preferences = JSON.parse(localStorage.getItem('spendsense.preferences.v1') || '{}')
        const theme = preferences.theme || 'system'
        const resolved = theme === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme
        document.documentElement.dataset.theme = resolved === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.reducedMotion = preferences.reduced_motion === true ? 'true' : 'false'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>SpendSense</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
